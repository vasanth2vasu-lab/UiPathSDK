<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UiPath Agent Hub</title>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    :root {
      --orange: #fa4616;
      --orange-dark: #e03d10;
      --orange-light: #fff4f0;
      --gray-50: #f8f9fa;
      --gray-100: #f0f2f5;
      --gray-200: #e0e0e0;
      --gray-300: #ccc;
      --gray-400: #aaa;
      --gray-500: #888;
      --gray-600: #666;
      --gray-700: #444;
      --gray-800: #2a2a2a;
      --gray-900: #1a1a1a;
      --purple: #6b5ce7;
      --purple-bg: #f8f4ff;
      --purple-border: #e8e0f0;
      --green: #22c55e;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: var(--gray-900);
    }

    /* ═══ Full-screen layout ═══ */
    .app {
      display: flex;
      flex-direction: column;
      height: 100vh;
      width: 100vw;
      background: var(--gray-50);
    }

    /* ═══ Top Bar: brand + agents row ═══ */
    .topbar {
      background: var(--gray-800);
      display: flex;
      align-items: center;
      padding: 0 20px;
      height: 64px;
      flex-shrink: 0;
      gap: 20px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .brand-logo {
      width: 30px;
      height: 30px;
      background: var(--orange);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: 800;
      font-size: 15px;
    }

    .brand-text {
      color: white;
      font-weight: 700;
      font-size: 15px;
      white-space: nowrap;
    }

    .divider {
      width: 1px;
      height: 28px;
      background: rgba(255,255,255,0.12);
      flex-shrink: 0;
    }

    /* Agent strip */
    .agent-strip {
      display: flex;
      align-items: center;
      gap: 6px;
      flex: 1;
      min-width: 0;
    }

    .agent-bubble {
      position: relative;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 700;
      color: white;
      cursor: pointer;
      transition: all 0.2s;
      flex-shrink: 0;
      border: 2px solid transparent;
    }

    .agent-bubble:hover {
      transform: scale(1.12);
      border-color: rgba(255,255,255,0.4);
    }

    .agent-bubble.active {
      border-color: var(--orange);
      box-shadow: 0 0 0 2px rgba(250,70,22,0.4);
      transform: scale(1.08);
    }

    /* Tooltip */
    .agent-bubble .tooltip {
      position: absolute;
      bottom: -34px;
      left: 50%;
      transform: translateX(-50%) scale(0.9);
      background: var(--gray-900);
      color: white;
      padding: 5px 10px;
      border-radius: 6px;
      font-size: 11.5px;
      font-weight: 500;
      white-space: nowrap;
      opacity: 0;
      pointer-events: none;
      transition: all 0.15s;
      z-index: 50;
    }

    .agent-bubble .tooltip::before {
      content: '';
      position: absolute;
      top: -4px;
      left: 50%;
      transform: translateX(-50%);
      border-left: 5px solid transparent;
      border-right: 5px solid transparent;
      border-bottom: 5px solid var(--gray-900);
    }

    .agent-bubble:hover .tooltip {
      opacity: 1;
      transform: translateX(-50%) scale(1);
    }

    /* ═══ Main: chat area fills rest of screen ═══ */
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 0;
      background: white;
    }

    /* Chat header (when agent selected) */
    .chat-bar {
      height: 48px;
      background: white;
      border-bottom: 1px solid var(--gray-200);
      display: flex;
      align-items: center;
      padding: 0 24px;
      gap: 10px;
      flex-shrink: 0;
    }

    .chat-bar-dot {
      width: 28px;
      height: 28px;
      border-radius: 7px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: 700;
      color: white;
      flex-shrink: 0;
    }

    .chat-bar-name { font-weight: 600; font-size: 13.5px; color: var(--gray-900); }
    .chat-bar-status { font-size: 11px; color: var(--green); margin-left: 8px; display: flex; align-items: center; gap: 4px; }
    .status-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--green); }

    /* Empty state */
    .empty-state {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .empty-inner { text-align: center; max-width: 360px; padding: 40px 20px; }

    .empty-icon {
      width: 64px; height: 64px; border-radius: 18px;
      background: var(--orange-light);
      display: inline-flex; align-items: center; justify-content: center;
      font-size: 28px; margin-bottom: 18px; color: var(--orange);
    }

    .empty-inner h2 { font-size: 18px; font-weight: 600; color: var(--gray-900); margin-bottom: 6px; }
    .empty-inner p { color: var(--gray-500); font-size: 13.5px; line-height: 1.6; }

    /* Messages */
    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 16px 24px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      scroll-behavior: smooth;
      min-height: 0;
    }

    #messages::-webkit-scrollbar { width: 5px; }
    #messages::-webkit-scrollbar-thumb { background: var(--gray-300); border-radius: 5px; }

    /* Welcome card */
    .chat-welcome {
      margin: auto;
      text-align: center;
      max-width: 420px;
      padding: 24px 16px;
    }

    .cw-icon {
      width: 48px; height: 48px; border-radius: 12px;
      display: inline-flex; align-items: center; justify-content: center;
      font-size: 20px; font-weight: 700; color: white; margin-bottom: 12px;
    }

    .chat-welcome h2 { font-size: 17px; font-weight: 600; color: var(--gray-900); margin-bottom: 4px; }
    .chat-welcome p { color: var(--gray-500); font-size: 13px; line-height: 1.5; margin-bottom: 14px; }

    .prompt-chips { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
    .prompt-chip {
      background: var(--gray-50); border: 1px solid var(--gray-200); border-radius: 16px;
      padding: 6px 13px; font-size: 12px; color: var(--gray-700); cursor: pointer; transition: all 0.15s;
    }
    .prompt-chip:hover { border-color: var(--orange); color: var(--orange); background: var(--orange-light); }

    /* Message rows */
    .message-row { display: flex; gap: 8px; align-items: flex-start; animation: fadeIn 0.2s ease-out; }
    .message-row.user { flex-direction: row-reverse; }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .avatar {
      width: 26px; height: 26px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 10px; font-weight: 700; flex-shrink: 0; margin-top: 1px;
    }

    .avatar.bot { background: linear-gradient(135deg, var(--orange), #ff7043); color: white; }
    .avatar.human { background: var(--gray-200); color: var(--gray-600); }

    .message {
      max-width: 65%; padding: 9px 14px; border-radius: 14px;
      line-height: 1.55; word-wrap: break-word; font-size: 13.5px;
    }

    .message.user {
      background: var(--orange); color: white;
      border-bottom-right-radius: 4px; white-space: pre-wrap;
    }

    .message.assistant {
      background: var(--gray-50); color: var(--gray-900);
      border-bottom-left-radius: 4px;
    }

    /* Markdown */
    .message.assistant p { margin: 0 0 6px; }
    .message.assistant p:last-child { margin-bottom: 0; }
    .message.assistant h1,.message.assistant h2,.message.assistant h3 { margin: 8px 0 4px; font-weight: 700; }
    .message.assistant h1 { font-size: 16px; }
    .message.assistant h2 { font-size: 15px; }
    .message.assistant h3 { font-size: 14px; }
    .message.assistant ul,.message.assistant ol { margin: 4px 0; padding-left: 18px; }
    .message.assistant li { margin: 2px 0; }
    .message.assistant code { background: #eee; padding: 1px 5px; border-radius: 4px; font-size: 12.5px; font-family: 'SFMono-Regular',Consolas,monospace; color: #d63384; }
    .message.assistant pre { background: #1e1e1e; color: #d4d4d4; padding: 10px 14px; border-radius: 8px; overflow-x: auto; margin: 6px 0; font-size: 12.5px; }
    .message.assistant pre code { background: none; padding: 0; color: inherit; }
    .message.assistant table { width: 100%; border-collapse: collapse; margin: 6px 0; font-size: 12.5px; }
    .message.assistant th { background: white; font-weight: 600; text-align: left; padding: 6px 8px; border-bottom: 2px solid var(--gray-200); }
    .message.assistant td { padding: 5px 8px; border-bottom: 1px solid #eee; }
    .message.assistant a { color: var(--orange); text-decoration: none; }
    .message.assistant a:hover { text-decoration: underline; }
    .message.assistant blockquote { border-left: 3px solid var(--orange); padding: 3px 10px; margin: 6px 0; color: var(--gray-700); background: white; border-radius: 0 6px 6px 0; }
    .message.assistant hr { border: none; border-top: 1px solid #eee; margin: 6px 0; }

    .msg-time { font-size: 10px; color: var(--gray-400); margin: 1px 0 4px 36px; }
    .msg-time.user { text-align: right; margin-right: 36px; margin-left: 0; }

    /* Tool indicator */
    .tool-indicator {
      display: flex; align-items: center; gap: 7px; padding: 5px 11px;
      background: var(--purple-bg); border: 1px solid var(--purple-border); border-radius: 8px;
      font-size: 12px; color: var(--purple); animation: fadeIn 0.2s ease-out;
      align-self: flex-start; margin-left: 36px;
    }

    .tool-spinner {
      width: 12px; height: 12px;
      border: 2px solid var(--purple-border); border-top-color: var(--purple);
      border-radius: 50%; animation: spin 0.8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .typing-indicator {
      display: flex; align-items: center; gap: 3px;
      padding: 8px 12px; align-self: flex-start; margin-left: 36px;
    }

    .typing-dot {
      width: 6px; height: 6px; border-radius: 50%; background: var(--gray-300);
      animation: bounce 1.2s infinite;
    }
    .typing-dot:nth-child(2) { animation-delay: 0.2s; }
    .typing-dot:nth-child(3) { animation-delay: 0.4s; }

    @keyframes bounce {
      0%,60%,100% { transform: translateY(0); }
      30% { transform: translateY(-4px); }
    }

    .citation-bar { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 6px; padding-top: 6px; border-top: 1px solid #e8e8e8; }
    .citation-link {
      padding: 2px 8px; background: white; border-radius: 10px;
      font-size: 11px; color: var(--gray-700); text-decoration: none; transition: background 0.15s;
    }
    .citation-link:hover { background: var(--gray-200); }

    /* Input */
    .chat-input-area {
      background: white; padding: 10px 24px; border-top: 1px solid var(--gray-200);
      display: flex; gap: 10px; flex-shrink: 0;
    }

    .chat-input-area input {
      flex: 1; padding: 10px 16px; border: 1.5px solid var(--gray-200); border-radius: 22px;
      font-size: 13.5px; outline: none; transition: border-color 0.2s; background: var(--gray-50);
    }

    .chat-input-area input:focus { border-color: var(--orange); background: white; }
    .chat-input-area input:disabled { background: var(--gray-100); }

    .send-btn {
      background: var(--orange); color: white; border: none; border-radius: 22px;
      padding: 10px 20px; font-size: 13.5px; font-weight: 600; cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }

    .send-btn:hover { background: var(--orange-dark); }
    .send-btn:active { transform: scale(0.97); }
    .send-btn:disabled { background: var(--gray-300); cursor: not-allowed; transform: none; }

    .loading-center {
      flex: 1; display: flex; align-items: center; justify-content: center;
      color: var(--gray-500); font-size: 13px; gap: 10px;
    }

    .mini-spinner {
      width: 16px; height: 16px;
      border: 2px solid var(--gray-200); border-top-color: var(--orange);
      border-radius: 50%; animation: spin 0.8s linear infinite;
    }

    .error-msg {
      background: #fee; color: #c00; padding: 10px 14px; border-radius: 8px; text-align: center; font-size: 13px;
    }

    /* Mobile */
    @media (max-width: 640px) {
      .topbar { padding: 0 12px; gap: 10px; height: 58px; }
      .brand-text { display: none; }
      .agent-bubble { width: 36px; height: 36px; font-size: 11px; }
      .message { max-width: 82%; }
      .chat-input-area { padding: 8px 12px; }
    }
  </style>
</head>
<body>
  <div class="app">
    <!-- Top Bar: brand + agent bubbles -->
    <div class="topbar">
      <div class="brand">
        <div class="brand-logo">U</div>
        <span class="brand-text">Agent Hub</span>
      </div>
      <div class="divider"></div>
      <div class="agent-strip" id="agent-strip"></div>
    </div>

    <!-- Main chat area -->
    <div class="main">
      <!-- Empty state -->
      <div class="empty-state" id="empty-state">
        <div class="empty-inner">
          <div class="empty-icon">&#9670;</div>
          <h2>Welcome to Agent Hub</h2>
          <p>Click any agent above to start chatting. All your organization's conversational agents are accessible from the top bar.</p>
        </div>
      </div>

      <!-- Chat view -->
      <div id="chat-view" style="display:none; flex-direction:column; height:100%;">
        <div class="chat-bar">
          <div class="chat-bar-dot" id="chat-bar-dot"></div>
          <span class="chat-bar-name" id="chat-bar-name"></span>
          <span class="chat-bar-status" id="chat-bar-status"><span class="status-dot"></span> Online</span>
        </div>
        <div id="messages"></div>
        <div class="chat-input-area">
          <input type="text" id="message-input" placeholder="Type a message..." autocomplete="off" />
          <button class="send-btn" id="send-btn" onclick="sendMessage()">Send</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    if (typeof marked !== 'undefined') {
      marked.setOptions({ breaks: true, gfm: true });
    }

    function renderMarkdown(text) {
      if (!text) return '';
      if (typeof marked !== 'undefined') return marked.parse(text);
      return text.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>');
    }

    function formatTime(d) {
      return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }

    const COLORS = ['#fa4616','#2563eb','#16a34a','#9333ea','#ea580c','#0891b2','#db2777','#475569','#92400e','#4f46e5'];
    function agentColor(i) { return COLORS[i % COLORS.length]; }

    let allAgents = [];
    let currentAgent = null;
    let currentAgentIndex = -1;
    let conversationId = null;
    let autoScroll = true;
    let agentDetail = null;

    // Session cache: keyed by agent index, stores { conversationId, agentDetail, messagesHtml, scrollTop }
    const agentSessions = new Map();
    // AbortController for in-flight chat requests
    let chatAbortController = null;

    const messagesEl = document.getElementById('messages');
    messagesEl.addEventListener('scroll', () => {
      autoScroll = messagesEl.scrollHeight - messagesEl.scrollTop - messagesEl.clientHeight < 40;
    });

    function scrollToBottom(smooth = true) {
      if (!autoScroll) return;
      messagesEl.scrollTo({ top: messagesEl.scrollHeight, behavior: smooth ? 'smooth' : 'instant' });
    }

    // ─── Load agents into top bar ───
    async function loadAgents() {
      try {
        const res = await fetch('/api/agents');
        allAgents = await res.json();
        renderAgentStrip();
      } catch (err) {
        document.getElementById('agent-strip').innerHTML =
          '<span style="color:#f87171;font-size:12px;">Failed to load agents</span>';
      }
    }

    function renderAgentStrip() {
      const strip = document.getElementById('agent-strip');
      strip.innerHTML = allAgents.map((agent, i) => {
        const color = agentColor(i);
        const initials = agent.name.split(/\s+/).map(w => w[0]).join('').substring(0, 2).toUpperCase();
        const active = i === currentAgentIndex ? ' active' : '';
        return `<div class="agent-bubble${active}" style="background:${color}" onclick="openAgent(${i})" title="${agent.name}">
          ${initials}
          <span class="tooltip">${agent.name}</span>
        </div>`;
      }).join('');
    }

    // ─── Save current session to cache ───
    function saveCurrentSession() {
      if (currentAgentIndex < 0) return;
      // Abort any in-flight chat request for the outgoing agent
      if (chatAbortController) {
        chatAbortController.abort();
        chatAbortController = null;
      }
      // Clean up typing/tool indicators before saving
      removeTypingIndicator();
      removeToolIndicator();
      // Re-enable input in case we were mid-stream
      document.getElementById('send-btn').disabled = false;
      document.getElementById('message-input').disabled = false;

      agentSessions.set(currentAgentIndex, {
        conversationId,
        agentDetail,
        messagesHtml: messagesEl.innerHTML,
        scrollTop: messagesEl.scrollTop
      });
    }

    // ─── Open Agent ───
    async function openAgent(index) {
      if (index === currentAgentIndex) return;

      // Save outgoing session
      saveCurrentSession();

      currentAgent = allAgents[index];
      currentAgentIndex = index;

      const color = agentColor(index);
      const initials = currentAgent.name.split(/\s+/).map(w => w[0]).join('').substring(0, 2).toUpperCase();

      renderAgentStrip();

      document.getElementById('empty-state').style.display = 'none';
      document.getElementById('chat-view').style.display = 'flex';

      document.getElementById('chat-bar-dot').style.background = color;
      document.getElementById('chat-bar-dot').textContent = initials;
      document.getElementById('chat-bar-name').textContent = currentAgent.name;

      // Check for cached session
      const cached = agentSessions.get(index);
      if (cached && cached.conversationId) {
        // Restore existing session
        conversationId = cached.conversationId;
        agentDetail = cached.agentDetail;
        messagesEl.innerHTML = cached.messagesHtml;
        document.getElementById('chat-bar-status').innerHTML = '<span class="status-dot"></span> Online';
        // Restore scroll position
        requestAnimationFrame(() => {
          messagesEl.scrollTop = cached.scrollTop;
        });
        document.getElementById('message-input').focus();
        return;
      }

      // No cached session — create a new one
      agentDetail = null;
      conversationId = null;

      document.getElementById('chat-bar-status').innerHTML = '<div class="mini-spinner" style="width:10px;height:10px;border-width:1.5px;"></div> Connecting...';
      messagesEl.innerHTML = '<div class="loading-center"><div class="mini-spinner"></div> Starting conversation...</div>';

      try {
        const [detailRes, convRes] = await Promise.all([
          fetch('/api/agents/' + currentAgent.id).then(r => r.json()).catch(() => null),
          fetch('/api/conversations', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ agentId: currentAgent.id, folderId: currentAgent.folderId, label: 'Web Chat' })
          }).then(r => r.json())
        ]);

        agentDetail = detailRes;
        conversationId = convRes.conversationId;
        document.getElementById('chat-bar-status').innerHTML = '<span class="status-dot"></span> Online';

        const title = agentDetail?.welcomeTitle || ('Chat with ' + currentAgent.name);
        const desc = agentDetail?.welcomeDescription || currentAgent.description || 'Ask anything to get started.';
        const prompts = agentDetail?.startingPrompts || [];

        let promptsHtml = '';
        if (prompts.length > 0) {
          promptsHtml = '<div class="prompt-chips">' +
            prompts.map(p => `<button class="prompt-chip" onclick="usePrompt(this)">${p}</button>`).join('') +
            '</div>';
        }

        messagesEl.innerHTML = `
          <div class="chat-welcome">
            <div class="cw-icon" style="background:${color}">${initials}</div>
            <h2>${title}</h2>
            <p>${desc}</p>
            ${promptsHtml}
          </div>`;

        document.getElementById('message-input').focus();
      } catch (err) {
        messagesEl.innerHTML = '<div class="error-msg">Failed to start conversation.</div>';
        document.getElementById('chat-bar-status').innerHTML = '<span style="color:#ef4444;">Disconnected</span>';
      }
    }

    function usePrompt(el) {
      document.getElementById('message-input').value = el.textContent;
      sendMessage();
    }

    // ─── Chat Helpers ───
    function addMessage(text, role) {
      const welcome = messagesEl.querySelector('.chat-welcome');
      if (welcome) welcome.remove();

      const row = document.createElement('div');
      row.className = 'message-row ' + role;

      const avatar = document.createElement('div');
      avatar.className = 'avatar ' + (role === 'user' ? 'human' : 'bot');
      avatar.textContent = role === 'user' ? 'U' : 'A';

      const bubble = document.createElement('div');
      bubble.className = 'message ' + role;
      if (role === 'user') {
        bubble.textContent = text;
      } else {
        bubble.innerHTML = text ? renderMarkdown(text) : '';
      }

      row.appendChild(avatar);
      row.appendChild(bubble);
      messagesEl.appendChild(row);

      const timeEl = document.createElement('div');
      timeEl.className = 'msg-time' + (role === 'user' ? ' user' : '');
      timeEl.textContent = formatTime(new Date());
      messagesEl.appendChild(timeEl);

      autoScroll = true;
      scrollToBottom(false);
      return bubble;
    }

    function showTypingIndicator() {
      const el = document.createElement('div');
      el.className = 'typing-indicator';
      el.id = 'typing-dots';
      el.innerHTML = '<div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div>';
      messagesEl.appendChild(el);
      scrollToBottom();
    }

    function removeTypingIndicator() {
      const el = document.getElementById('typing-dots');
      if (el) el.remove();
    }

    function showToolIndicator(name) {
      const el = document.createElement('div');
      el.className = 'tool-indicator';
      el.id = 'tool-active';
      el.innerHTML = '<div class="tool-spinner"></div> Using <strong>' + name + '</strong>...';
      messagesEl.appendChild(el);
      scrollToBottom();
    }

    function removeToolIndicator() {
      const el = document.getElementById('tool-active');
      if (el) el.remove();
    }

    // ─── Send Message ───
    async function sendMessage() {
      const input = document.getElementById('message-input');
      const text = input.value.trim();
      if (!text || !conversationId) return;

      input.value = '';
      addMessage(text, 'user');

      const sendBtn = document.getElementById('send-btn');
      sendBtn.disabled = true;
      input.disabled = true;

      showTypingIndicator();

      let assistantEl = null;
      let currentText = '';
      let citations = [];
      let firstChunk = true;

      // Track which agent this request belongs to
      const requestAgentIndex = currentAgentIndex;
      // Create abort controller for this request
      if (chatAbortController) chatAbortController.abort();
      chatAbortController = new AbortController();
      const signal = chatAbortController.signal;

      try {
        const res = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ conversationId, message: text }),
          signal
        });

        const reader = res.body.getReader();
        const decoder = new TextDecoder();
        let buffer = '';

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;

          buffer += decoder.decode(value, { stream: true });
          const lines = buffer.split('\n');
          buffer = lines.pop() || '';

          let eventType = '';
          for (const line of lines) {
            // Skip if user switched to a different agent
            if (currentAgentIndex !== requestAgentIndex) break;
            if (line.startsWith('event: ')) {
              eventType = line.slice(7);
            } else if (line.startsWith('data: ') && eventType) {
              try {
                const data = JSON.parse(line.slice(6));

                if (eventType === 'chunk') {
                  if (firstChunk) {
                    removeTypingIndicator();
                    removeToolIndicator();
                    assistantEl = addMessage('', 'assistant');
                    firstChunk = false;
                  }
                  currentText += data.text;
                  assistantEl.innerHTML = renderMarkdown(currentText);
                  scrollToBottom();

                } else if (eventType === 'tool') {
                  if (data.status === 'started') {
                    removeTypingIndicator();
                    showToolIndicator(data.name);
                  } else if (data.status === 'completed') {
                    removeToolIndicator();
                    showTypingIndicator();
                  }

                } else if (eventType === 'citations') {
                  if (data.citations) citations = citations.concat(data.citations);

                } else if (eventType === 'citation') {
                  citations.push(data);

                } else if (eventType === 'error') {
                  removeTypingIndicator();
                  removeToolIndicator();
                  if (!assistantEl) assistantEl = addMessage('', 'assistant');
                  assistantEl.innerHTML = '<span style="color:#c00">Error: ' + data.message + '</span>';
                }
              } catch (e) {}
              eventType = '';
            }
          }
        }

        if (assistantEl && citations.length > 0) {
          const bar = document.createElement('div');
          bar.className = 'citation-bar';
          const seen = new Set();
          citations.forEach(c => {
            (c.sources || []).forEach(s => {
              const url = s.url || s.downloadUrl;
              const title = s.title || 'Source';
              if (url && !seen.has(url)) {
                seen.add(url);
                const a = document.createElement('a');
                a.className = 'citation-link';
                a.href = url;
                a.target = '_blank';
                a.rel = 'noopener';
                a.textContent = title;
                bar.appendChild(a);
              }
            });
          });
          if (bar.children.length > 0) assistantEl.appendChild(bar);
        }

        if (!currentText && firstChunk) {
          removeTypingIndicator();
          removeToolIndicator();
          addMessage('No response from agent. Please try again.', 'assistant');
        }
      } catch (err) {
        // Ignore abort errors from switching agents
        if (err.name === 'AbortError') return;
        if (currentAgentIndex === requestAgentIndex) {
          removeTypingIndicator();
          removeToolIndicator();
          addMessage('Failed to get response. Please try again.', 'assistant');
        }
      }

      // Only touch UI if we're still on the same agent
      if (currentAgentIndex === requestAgentIndex) {
        removeTypingIndicator();
        removeToolIndicator();
        sendBtn.disabled = false;
        input.disabled = false;
        input.focus();
      }
    }

    document.getElementById('message-input').addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });

    loadAgents();
  </script>
</body>
</html>
